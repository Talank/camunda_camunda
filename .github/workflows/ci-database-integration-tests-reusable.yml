name: Database integration tests reusable

on:
  workflow_dispatch:
defaults:
  run:
    shell: bash

env:
  GHA_BEST_PRACTICES_LINTER: enabled
  FLAKY_TEST_RERUN_COUNT: ${{ github.event_name == 'pull_request' && '3' || '7' }}

jobs:
  integration-tests:
    name: "${{ inputs.database-type }}"
    permissions: {}   # GITHUB_TOKEN unused in this job
    timeout-minutes: 20
    runs-on: ${{ inputs.runs-on }}
    env:
      ZEEBE_TEST_DOCKER_IMAGE: localhost:5000/camunda/zeebe:current-test
      CAMUNDA_TEST_DOCKER_IMAGE: localhost:5000/camunda/camunda:current-test
      IMAGE_VERSION: ${{inputs.database-image-version}}
    outputs:
      flakyTests: ${{ steps.analyze-test-run.outputs.flakyTests }}
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@main
      - run: |
          if [ -z "${{ inputs.database-container }}" ]; then
            echo "DATABASE_CONTAINER=${{ inputs.database-type }}" >> "$GITHUB_ENV"
          else
            echo "DATABASE_CONTAINER=${{ inputs.database-container }}" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-build
        with:
          maven-cache-key-modifier: "it-database-${{ inputs.database-type }}"
          vault-address: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
      # start the required database service
      - name: Start Database service
        if: always()
        run: |
          docker compose -f db/docker-compose.yml up -d --wait ${{ env.DATABASE_CONTAINER }} || {
            docker compose -f db/docker-compose.yml logs
            exit 1
          }
      # Build the platform before running the integration tests; skipping frontend
      - uses: ./.github/actions/build-zeebe
        id: build-zeebe
        with:
          maven-extra-args: -T1C -PskipFrontendBuild
      - name: Create build output log file
        run: echo "BUILD_OUTPUT_FILE_PATH=$(mktemp)" >> "$GITHUB_ENV"
      # To communicate to the IT what database to expect and run against:
      # -Dcamunda.it.database.type=rdbms
      #
      - name: Run database integration test with ${{ inputs.database-type }}
        run: >
          ./mvnw -B -T 2 --no-snapshot-updates
          -D forkCount=6
          -D maven.javadoc.skip=true
          -D skipUTs
          -D skipChecks
          -D failsafe.rerunFailingTestsCount=${{ env.FLAKY_TEST_RERUN_COUNT }}
          -D flaky.test.reportDir=failsafe-reports
          -D test.integration.camunda.database.type=${{inputs.it-database-type}}
          -D test.integration.camunda.database.fast-init=true
          -P parallel-tests,extract-flaky-tests,skipFrontendBuild,${{inputs.maven-profiles}}
          -pl 'qa/acceptance-tests'
          verify
          | tee "${BUILD_OUTPUT_FILE_PATH}"
      - name: Stop Database service
        if: always()
        run: docker-compose -f db/docker-compose.yml down
      - name: Analyze Test Runs
        id: analyze-test-run
        if: always()
        uses: ./.github/actions/analyze-test-runs
        with:
          buildOutputFilePath: ${{ env.BUILD_OUTPUT_FILE_PATH }}
      - name: Upload test artifacts
        uses: ./.github/actions/collect-test-artifacts
        if: always()
        with:
          name: "[IT] ${{inputs.test-type-label}} - ${{inputs.database-name}}"
      - name: Write matrix outputs for test analysis
        uses: cloudposse/github-action-matrix-outputs-write@ed06cf3a6bf23b8dce36d1cf0d63123885bb8375 # 1.0.0
        continue-on-error: true
        id: matrix-write
        with:
          matrix-step-name: "${{ inputs.test-type }}"
          matrix-key: "${{ inputs.test-type }} - ${{ inputs.database-type }}"
          outputs: |-
            flakyTests: ${{ toJson(steps.analyze-test-run.outputs.flakyTests) }}
            hasFlaky: ${{ steps.analyze-test-run.outputs.flakyTests != '' }}
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          job_name: "${{ inputs.test-type }}/${{ inputs.database-type }}"
          build_status: ${{ job.status }}
          user_reason: ${{ (steps.analyze-test-run.outputs.flakyTests != '') && 'flaky-tests' || '' }}
          user_description: "General"
          detailed_junit_tests: true
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}

    strategy:
      fail-fast: false
  send-slack-notification:
    name: "Send slack notification on fail"
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always() && (needs.integration-tests.result == 'failure' || needs.integration-tests.result == 'cancelled') && 
      inputs.notify-slack-on-failure && (github.ref == 'refs/heads/main' || startsWith(github.ref, 
      'refs/heads/stable/'))
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Import secrets from Vault
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/products/camunda/ci/github-actions DATA_ENGINE_CI_ALERT_WEBHOOK_URL;
      - name: Send notification
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ steps.secrets.outputs.DATA_ENGINE_CI_ALERT_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          # For posting a rich message using Block Kit
          payload: |
            text: "Scheduled Database Integration Tests for ${{inputs.database-name}} on ${{ github.ref_name }} failed or were cancelled"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Scheduled Database Integration Tests for **${{inputs.database-name}}** on **${{ github.ref_name }}** FAILED or WERE CANCELLED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # Send metrics about CI health
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          job_name: "send-slack-notification/${{ inputs.database-type }}"
          build_status: ${{ job.status }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
